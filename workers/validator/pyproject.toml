[project]
name = "validator"
version = "0.1.0"
description = "Azure Container App Worker for JIVE"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "azure-storage-queue>=12.17.0",
    "polars>=1.44.2",
    "pydantic>=2.13.4",
    "tenacity>=9.1.4",
    "xlsxwriter>=3.2.9",
    "httpx2>=2.13.1",
    "argus",
    "jira",
    "jive_logging"
]

[dependency-groups]
dev = [
    "httpx2-pytest>=2.0.0",
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.uv.sources]
argus = { path = "../../common/argus" , editable = true }
jira = { path = "../../common/jira", editable = true  }
jive_logging = { path = "../../common/jive_logging" , editable = true }



[tool.ruff]
exclude = [
"*.ipynb",
"../local/",
"../api/"
]
line-length = 100
[tool.ruff.lint]
select = ["UP", "E", "F", "I", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "strict"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[project.scripts]
jive-validator = "validator.main:main" 
