[project]
name = "argus"
version = "2026.06.21.00"
description = "A flexible framework that can quickly process and validate standardised and less-standardised datasets."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastexcel>=0.19.0",
    "httpx2>=2.16.0",
    "polars>=1.44.2",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ruff>=0.17.2",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
exclude = [
"*.ipynb"
]
line-length = 100
[tool.ruff.lint]
select = ["UP", "E", "F", "I", "B", "SIM"]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "argus"     
module-root = "src"    

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["."]
addopts = "--cov=src/argus --cov-report=term-missing"
