[project]
name = "worker-base"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"

requires-python = ">=3.14"
dependencies = [
    "azure-storage-queue>=12.18.1",
    "jira",
    "jive_logging",
    "pydantic-settings>=2.16.2",
]


[tool.uv.sources]
jira = { path = "../../common/jira", editable = true  }
jive_logging = { path = "../../common/jive_logging" , editable = true }

[project.scripts]
worker-base = "worker_base:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.ruff]
exclude = [
"*.ipynb"
]
line-length = 100
[tool.ruff.lint]
select = ["UP", "E", "F", "I", "B", "SIM"]
