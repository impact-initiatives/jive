# config/schemas/jmmi_schema.yaml
# JMMI Dataset Configuration

_imports:
  - "../../../common/schema_defaults.yaml"
  - "../../config/schema_defaults.yaml"

programme_type: "jmmi"
output_type: "dataset"

loaded_sheets:
  - $use: raw_data
    override:
      linked_log: deletion_log
      linked_sheet: clean_data
  
  - $use: clean_data
    override:
      linked_log: cleaning_log
      linked_sheet: raw_data
    $append_columns:
      - standard_name: "country"
        allow_fuzzy_matching: false
        allow_empty_values: false
      - standard_name: "round"
        allow_fuzzy_matching: false
      - $use: temporal_columns
      - $use: admin_columns

  - $use: cleaning_log_base
    override:
      parent_sheet: clean_data
      parent_linking_column: uuid
    $append_columns:
      - $use: uuid_column
        override:
          is_unique: false

  - $use: survey
  - $use: choices
  - $use: deletion_log_base
    override:
      parent_sheet: raw_data
      parent_linking_column: uuid
    $append_columns:
      - $use: uuid_column
        
  - $use: variable_tracker_sheet
  - $use: meb_analysis
  - $use: mfs_analysis


unloaded_sheets:
  - $use: read_me
  - $use: sampling_info  
  - $use: enumerator_performance_sheet
  - $use: checklist_data_cleaning

  