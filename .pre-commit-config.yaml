exclude: ^local/
repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.17.5
  hooks:
    # Run the linter.
    - id: ruff-check
      types_or: [ python, pyi, pyproject ]
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format

- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: v1.32.0
  hooks:
    - id: zizmor
      args: [--no-progress, --fix]

- repo: https://github.com/tofuutils/pre-commit-opentofu
  rev: v2.4.2
  hooks:
    - id: tofu_fmt
    - id: tofu_validate
