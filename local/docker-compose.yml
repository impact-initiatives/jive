services:
  # ──────────────────────────────────────────────────────────────
  # 1. Azurite: Local Azure Storage Emulator
  # ──────────────────────────────────────────────────────────────
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: jive-azurite
    hostname: azurite
    ports:
      - "10001:10001" # Queue service
      - "10000:10000" # Blob service
    command: azurite --queueHost 0.0.0.0 --blobHost 0.0.0.0 --skipApiVersionCheck

  # ──────────────────────────────────────────────────────────────
  # 2. JIVE Ingress: Webhook Handler
  # ──────────────────────────────────────────────────────────────
  jive-ingress:
    build:
      context: ../../jive
      dockerfile: api/Dockerfile
    container_name: jive-ingress
    ports:
      - "8000:8000"
    env_file:
      - ../api/.env
    environment:
      - AZURE_STORAGE_CONNECTION_STRING=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;QueueEndpoint=http://azurite:10001/devstoreaccount1;BlobEndpoint=http://azurite:10000/devstoreaccount1;
    depends_on:
      - azurite

  # ──────────────────────────────────────────────────────────────
  # 3. JIVE Worker: Queue Consumer
  # ──────────────────────────────────────────────────────────────
  jive-validator:
    build:
      context: ../../jive
      dockerfile: workers/validator/Dockerfile
    container_name: jive-validator
    env_file:
      - ../.env
    environment:
      - AZURE_STORAGE_CONNECTION_STRING=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;QueueEndpoint=http://azurite:10001/devstoreaccount1;BlobEndpoint=http://azurite:10000/devstoreaccount1;
      - MAX_EXCEL_ERRORS=500000
      - ARGUS_SCHEMAS_VERSION=latest
    depends_on:
      - azurite

  jive-file-mover:
    build:
      context: ../../jive
      dockerfile: workers/file_mover/Dockerfile
    container_name: jive-file_mover
    env_file:
      - ../.env
    environment:
      - AZURE_STORAGE_CONNECTION_STRING=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;QueueEndpoint=http://azurite:10001/devstoreaccount1;BlobEndpoint=http://azurite:10000/devstoreaccount1;
    depends_on:
      - azurite
