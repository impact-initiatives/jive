[project]
name = "worker"
version = "0.1.0"
description = "Azure Container App Worker for JIVE"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "azure-storage-queue>=12.17.0",
    "polars>=1.44.2",
    "pydantic>=2.13.4",
    "tenacity>=9.1.4",
    "xlsxwriter>=3.2.9",
    "argus @ git+https://github.com/impact-initiatives/argus.git",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "responses>=0.26.2",
    "ruff>=0.16.7",
]

[tool.ruff]
exclude = [
"*.ipynb",
"../local/",
"../api/"
]
line-length = 100
[tool.ruff.lint]
select = ["UP", "E", "F", "I", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "strict"

[build-system]
requires = ["uv_build>=0.12.15,<0.13"]
build-backend = "uv_build"

