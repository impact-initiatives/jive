name: Build Translation Files
on: 
  push:
    branches: [main]
    paths:
      - 'common/argus/src/argus/locales/**/*.po'
      - 'common/argus/src/argus/locales/update_files.sh'
  pull_request:
    paths:
      - 'common/argus/src/argus/locales/**/*.po'
      - 'common/argus/src/argus/locales/update_files.sh'
  workflow_dispatch:
 
jobs:
  build-translations:
    runs-on: ubuntu-latest
    permissions:
      contents: write  
    defaults:
      run:
        working-directory: ./common/argus
    
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Gettext
        run: sudo apt-get install -y gettext
      
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
      
      - name: Install the project
        run: uv sync --locked --all-extras --dev
      
      - name: Make File Executable
        run: chmod +x ./src/argus/locales/update_files.sh
      
      - name: Rebuild Translation Files
        run: ./src/argus/locales/update_files.sh

      - name: Check for changes on PR (fail if outdated)
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "::error::Translation files are out of date. Run ./src/argus/locales/update_files.sh locally and commit the changes."
            exit 1
          fi

      - name: Commit and push translations
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add '*.mo'
          git -c user.name="GitHub Actions" -c user.email="actions@github.com" \
            commit -m 'rebuild translation files'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" HEAD:main