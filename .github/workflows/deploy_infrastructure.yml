name: Deploy infrastructure

# Deplpoys images and other infrastructure changes to the relevant Azure environment.


on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment (maps to opentofu file)'
        required: true
        type: string
      image_tag:
        description: 'New image tag for the components being deployed'
        required: true
        type: string
      argus_schemas_release_tag:
        description: '"Argus Schemas" release tag in format "YYYYMMDDXX" or "latest".'
        required: true
        type: string        
      deploy_api:
        description: 'Deploy new tag to the API container app'
        required: true
        type: boolean
      deploy_worker_validator:
        description: 'Deploy new tag to the validation worker job'
        required: true
        type: boolean

    secrets:
      AZURE_CREDENTIALS:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      ACR_RESOURCE_GROUP:
        required: true
      ACR_USERNAME:
        required: true
      ACR_PASSWORD:
        required: true
      JIVE_API_KEY:
        required: true
      JIRA_API_TOKEN:
        required: true
      JIRA_CLOUD_ID:
        required: true
      JIVE_DOCUMENTATION:
        required: true
      ALLOWED_DOMAINS:
        required: true
      JIRA_BASE_URL:
        required: true
      LOG_ANALYTICS_SHARED_KEY:
        required: true
      
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment.'
        type: choice
        options: [dev, test]
        required: true
      image_tag:
        description: 'Image tag to deploy'
        required: true
        type: string
      argus_schemas_release_tag:
        description: '"Argus Schemas" release tag in format "YYYYMMDDXX".'
        required: true
        type: string
        default: latest
      deploy_api:
        description: 'Deploy API app'
        type: boolean
        default: false
      deploy_worker_validator:
        description: 'Deploy validation worker job'
        type: boolean
        default: false
    

permissions:
  contents: read

env:
  API_APP_NAME: jive-api
  VALIDATOR_JOB_NAME: jive-worker-validator

concurrency:
  group: deploy-jive-${{ inputs.environment }}
  cancel-in-progress: false

jobs:   

  deploy:
    runs-on: ubuntu-latest
    env:
      ACR_RESOURCE_GROUP: ${{ secrets.ACR_RESOURCE_GROUP }}
      IMAGE_TAG_API: ${{ inputs.deploy_api && inputs.image_tag || '' }}
      IMAGE_TAG_WORKER_VALIDATOR: ${{ inputs.deploy_worker_validator && inputs.image_tag || '' }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      JIVE_API_KEY: ${{ secrets.JIVE_API_KEY }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_CLOUD_ID: ${{ secrets.JIRA_CLOUD_ID }}
      JIVE_DOCUMENTATION: ${{ secrets.JIVE_DOCUMENTATION }}
      ALLOWED_DOMAINS: ${{ secrets.ALLOWED_DOMAINS }}
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      LOG_ANALYTICS_SHARED_KEY: ${{ secrets.LOG_ANALYTICS_SHARED_KEY }}
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:     

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # ensure that there was a release before deploying to prod
      - name: Verify GitHub release exists
        if: ${{ inputs.environment == 'prod' }}
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          if ! gh release view "$IMAGE_TAG" --repo "$GITHUB_REPOSITORY" \
               --json tagName,isDraft,isPrerelease --jq '.tagName' >/dev/null 2>&1; then
            echo "::error::No GitHub release found for tag '$IMAGE_TAG'. Production deployments require a published release."
            exit 1
          fi

          draft=$(gh release view "$IMAGE_TAG" --repo "$GITHUB_REPOSITORY" \
                    --json isDraft --jq '.isDraft')
          if [ "$draft" = "true" ]; then
            echo "::error::Release '$IMAGE_TAG' exists but is a draft. Publish it before deploying to prod."
            exit 1
          fi

      - name: Azure login
        uses: azure/login@v3.1.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # checks that things are released in sequence: dev > test > prod
      - name: Verify promotion chain
        if: ${{ inputs.environment != 'dev' }}
        env:
          RESOURCE_GROUP: ${{ env.ACR_RESOURCE_GROUP }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          ENVIRONMENT: ${{ inputs.environment }}
          DEPLOY_API: ${{ inputs.deploy_api }}
          DEPLOY_WORKER_VALIDATOR: ${{ inputs.deploy_worker_validator }}
        run: |
          set -euo pipefail

          case "$ENVIRONMENT" in
            test) prev_env="dev" ;;
            prod) prev_env="test" ;;
            *) echo "::error::Unknown environment '$ENVIRONMENT'"; exit 1 ;;
          esac

          get_image_tag() {
            local kind="$1" name="$2"
            if [ "$kind" = "job" ]; then
              az containerapp job show -n "$name" -g "$RESOURCE_GROUP" \
                --query "properties.template.containers[0].image" -o tsv
            else
              az containerapp show -n "$name" -g "$RESOURCE_GROUP" \
                --query "properties.template.containers[0].image" -o tsv
            fi
          }

          specs=()
          if [ "$DEPLOY_API" = "true" ]; then
            specs+=("app:${API_APP_NAME}-${prev_env}")
          fi
          if [ "$DEPLOY_WORKER_VALIDATOR" = "true" ]; then
            specs+=("job:${VALIDATOR_JOB_NAME}-${prev_env}")
          fi

          for spec in "${specs[@]}"; do
            kind="${spec%%:*}"; name="${spec#*:}"
            echo "::notice::Verifying '$name' in '$prev_env' is running tag '$IMAGE_TAG'"
            if ! az containerapp show -n "$name" -g "$RESOURCE_GROUP" -o none >/dev/null 2>&1; then
              echo "::error::$name not found in '$prev_env' — deploy release $IMAGE_TAG to $prev_env first"
              exit 1
            fi
            tag=$(get_image_tag "$kind" "$name")
            tag="${tag##*:}"
            if [ "$tag" != "$IMAGE_TAG" ]; then
              echo "::error::$name in '$prev_env' is on '$tag', not '$IMAGE_TAG'. Deploy to $prev_env first."
              exit 1
            fi
          done

     

      # For components NOT being deployed, look up the currently running
      # image tag so the opentofu deploy leaves them untouched.
      - name: Resolve current image tags
        env:
          RESOURCE_GROUP: ${{ env.ACR_RESOURCE_GROUP }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          resolve_tag() {
            local kind="$1" name="$2"
            local tag
            if [ "$kind" = "job" ]; then
              tag=$(az containerapp job show -n "$name" -g "$RESOURCE_GROUP" \
                --query "properties.template.containers[0].image" -o tsv 2>/dev/null | awk -F: '{print $NF}')
            else
              tag=$(az containerapp show -n "$name" -g "$RESOURCE_GROUP" \
                --query "properties.template.containers[0].image" -o tsv 2>/dev/null | awk -F: '{print $NF}')
            fi

            if [ -n "$tag" ] && [[ "$tag" != *"NotFound"* ]]; then
              echo "Resolved existing tag for $name: $tag" >&2   
              echo "$tag"
            elif az "$kind" show -n "$name" -g "$RESOURCE_GROUP" -o none 2>/dev/null; then
              echo "::error::$name exists but its image tag could not be resolved"
              exit 1
            else
              echo "::notice::$name not found — first deployment, will use new tag '$NEW_TAG'" >&2
              echo "$NEW_TAG"
            fi
          }

          export NEW_TAG="$IMAGE_TAG"

          if [ -z "$IMAGE_TAG_API" ]; then
            IMAGE_TAG_API=$(resolve_tag app "${API_APP_NAME}-${ENVIRONMENT}")
            echo "IMAGE_TAG_API=$IMAGE_TAG_API" >> "$GITHUB_ENV"
          fi

          if [ -z "$IMAGE_TAG_WORKER_VALIDATOR" ]; then
            IMAGE_TAG_WORKER_VALIDATOR=$(resolve_tag job "${VALIDATOR_JOB_NAME}-${ENVIRONMENT}")
            echo "IMAGE_TAG_WORKER_VALIDATOR=$IMAGE_TAG_WORKER_VALIDATOR" >> "$GITHUB_ENV"
          fi

      - name: Resolve Argus schemas version
        env:
          ARGUS_SCHEMAS_REPO: impact-initiatives/argus_schemas
          PROVIDED_TAG: ${{ inputs.argus_schemas_release_tag || 'latest' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "$PROVIDED_TAG" != "latest" ]; then
            if ! gh release view "$PROVIDED_TAG" --repo "$ARGUS_SCHEMAS_REPO" \
                 --json tagName --jq '.tagName' >/dev/null 2>&1; then
              echo "::error::No release '$PROVIDED_TAG' in $ARGUS_SCHEMAS_REPO. Publish it before deploying."
              exit 1
            fi
            resolved="$PROVIDED_TAG"
          else
            # GitHub's /releases/latest returns the newest non-draft, non-prerelease release
            resolved=$(gh api "repos/${ARGUS_SCHEMAS_REPO}/releases/latest" --jq '.tag_name')
            echo "::notice::No Argus schemas tag provided — resolved to latest release '$resolved'"
          fi

          echo "ARGUS_SCHEMAS_VERSION=$resolved" >> "$GITHUB_ENV"

      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: latest
 
      - name: Tofu init
        working-directory: infra
        env:
          RESOURCE_GROUP: ${{ env.ACR_RESOURCE_GROUP }}
          ENVIRONMENT: ${{ inputs.environment }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          tofu init -input=false \
            -backend-config="resource_group_name=$RESOURCE_GROUP" \
            -backend-config="storage_account_name=hqtfstatedev" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=jive/"$ENVIRONMENT".tfstate" \
            -backend-config="subscription_id=$SUBSCRIPTION_ID"

      - name: Tofu validate
        working-directory: infra
        run: tofu validate 

      - name: Tofu plan
        id: plan 
        working-directory: infra
        env:
          TF_VAR_resource_group_name: ${{ env.ACR_RESOURCE_GROUP }}
          TF_VAR_container_registry_username: ${{ env.ACR_USERNAME }}
          TF_VAR_container_registry_password: ${{ env.ACR_PASSWORD }}
          TF_VAR_jive_api_key: ${{ env.JIVE_API_KEY }}
          TF_VAR_jira_api_token: ${{ env.JIRA_API_TOKEN }}
          TF_VAR_jira_cloud_id: ${{ env.JIRA_CLOUD_ID }}
          TF_VAR_jive_documentation: ${{ env.JIVE_DOCUMENTATION }}
          TF_VAR_argus_schemas_version: ${{ env.ARGUS_SCHEMAS_VERSION }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          tofu plan \
            -input=false \
            -var-file=environments/"$ENVIRONMENT".tfvars \
            -var="image_tag_api=${IMAGE_TAG_API}" \
            -var="image_tag_worker_validator=${IMAGE_TAG_WORKER_VALIDATOR}" \
            -out=tfplan

      - name: Render plan to job summary
        if: steps.plan.outcome == 'success'
        working-directory: infra  
        run: |
          tofu show tfplan -no-color >> "$GITHUB_STEP_SUMMARY"

      - name: Tofu apply
        working-directory: infra
        run: tofu apply -input=false -auto-approve tfplan