name: Deploy infrastructure

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment (maps to opentofu file)'
        required: true
        type: string
      image_tag:
        description: 'New image tag for the components being deployed'
        required: true
        type: string
      deploy_api:
        description: 'Deploy new tag to the API container app'
        required: true
        type: boolean
      deploy_worker:
        description: 'Deploy new tag to the validation worker job'
        required: true
        type: boolean
      require_approval:
        description: 'Block until a human approves before deploying'
        required: false
        type: boolean
        default: false
      approvers:
        description: 'GitHub team/user names who may approve'
        required: false
        type: string
    secrets:
      AZURE_CREDENTIALS:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      ACR_RESOURCE_GROUP:
        required: true
      ACR_USERNAME:
        required: true
      ACR_PASSWORD:
        required: true
      JIVE_API_KEY:
        required: true
      JIRA_API_TOKEN:
        required: true
      JIRA_CLOUD_ID:
        required: true
      JIVE_DOCUMENTATION:
        required: true
      ALLOWED_DOMAINS:
        required: true
      JIRA_BASE_URL:
        required: true
      LOG_ANALYTICS_SHARED_KEY:
        required: true
      
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        options: [dev, test]
        required: true
      image_tag:
        description: 'Image tag to deploy'
        required: true
        type: string
      deploy_api:
        description: 'Deploy API app'
        type: boolean
        default: true
      deploy_worker:
        description: 'Deploy worker job'
        type: boolean
        default: true
    

permissions:
  contents: read

env:
  APP_NAME: jive-api
  JOB_NAME: jive-worker-validator

concurrency:
  group: deploy-jive-${{ inputs.environment }}
  cancel-in-progress: false

jobs:   

  deploy:
    runs-on: ubuntu-latest
    env:
      ACR_RESOURCE_GROUP: ${{ secrets.ACR_RESOURCE_GROUP }}
      IMAGE_TAG_API: ${{ inputs.deploy_api && inputs.image_tag || '' }}
      IMAGE_TAG_WORKER: ${{ inputs.deploy_worker && inputs.image_tag || '' }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      JIVE_API_KEY: ${{ secrets.JIVE_API_KEY }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_CLOUD_ID: ${{ secrets.JIRA_CLOUD_ID }}
      JIVE_DOCUMENTATION: ${{ secrets.JIVE_DOCUMENTATION }}
      ALLOWED_DOMAINS: ${{ secrets.ALLOWED_DOMAINS }}
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      LOG_ANALYTICS_SHARED_KEY: ${{ secrets.LOG_ANALYTICS_SHARED_KEY }}
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:     

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Azure login
        uses: azure/login@v3.1.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify promotion chain
        if: ${{ inputs.environment != 'dev' }}
        env:
          RESOURCE_GROUP: ${{ env.ACR_RESOURCE_GROUP }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          prev_env="dev"
          # check both components in the previous environment are on this tag
          for spec in "containerapp:$APP_NAME" "containerapp job:$JOB_NAME"; do
            kind="${spec%%:*}"; name="${spec#*:}"
            image=$(az $kind show -n "$name" -g "$RESOURCE_GROUP" \
              --query "properties.template.containers[0].image" -o tsv)
            tag="${image##*:}"
            if [ "$tag" != "$IMAGE_TAG" ]; then
              echo "::error::$name in '$prev_env' is on '$tag', not '$IMAGE_TAG'. Deploy to dev first."
              exit 1
            fi
          done

      - name: Promotion approval
        if: ${{ inputs.require_approval }}
        uses: trstringer/manual-approval@v1.13.1
        with:
          minimum-approvals: 1
          approvers: ${{ inputs.approvers }}
          secret: ${{ github.token }}
          issue-title: "Promote jive ${{ inputs.image_tag }} to ${{ inputs.environment }}?"
          issue-body: "Approving deploys release ${{ inputs.image_tag }} to ${{ inputs.environment }}."

      # For components NOT being deployed, look up the currently running
      # image tag so the Bicep deploy leaves them untouched.
      - name: Resolve current image tags
        env:
          RESOURCE_GROUP: ${{ env.ACR_RESOURCE_GROUP }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          resolve_tag() {
            local kind="$1" name="$2"
            local tag
            tag=$(az "$kind" show -n "$name" -g "$RESOURCE_GROUP" \
                  --query "properties.template.containers[0].image" -o tsv 2>/dev/null | awk -F: '{print $NF}')

            if [ -n "$tag" ] && [[ "$tag" != *"NotFound"* ]]; then
              echo "Resolved existing tag for $name: $tag" >&2   
              echo "$tag"
            elif az "$kind" show -n "$name" -g "$RESOURCE_GROUP" -o none 2>/dev/null; then
              echo "::error::$name exists but its image tag could not be resolved"
              exit 1
            else
              echo "::notice::$name not found — first deployment, will use new tag '$NEW_TAG'" >&2
              echo "$NEW_TAG"
            fi
          }

          export NEW_TAG="$IMAGE_TAG"

          if [ -z "$IMAGE_TAG_API" ]; then
            IMAGE_TAG_API=$(resolve_tag containerapp "$APP_NAME")
            echo "IMAGE_TAG_API=$IMAGE_TAG_API" >> "$GITHUB_ENV"
          fi

          if [ -z "$IMAGE_TAG_WORKER" ]; then
            IMAGE_TAG_WORKER=$(resolve_tag containerapp job "$JOB_NAME")
            echo "IMAGE_TAG_WORKER=$IMAGE_TAG_WORKER" >> "$GITHUB_ENV"
          fi

      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: latest
 
      - name: Tofu init
        working-directory: infra
        env:
          RESOURCE_GROUP: ${{ env.ACR_RESOURCE_GROUP }}
          ENVIRONMENT: ${{ inputs.environment }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          tofu init -input=false \
            -backend-config="resource_group_name=$RESOURCE_GROUP" \
            -backend-config="storage_account_name=hqtfstatedev" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=jive/"$ENVIRONMENT".tfstate" \
            -backend-config="subscription_id=$SUBSCRIPTION_ID"

      - name: Tofu validate
        working-directory: infra
        run: tofu validate 

      - name: Tofu plan
        working-directory: infra
        env:
          TF_VAR_resource_group_name: ${{ env.ACR_RESOURCE_GROUP }}
          TF_VAR_container_registry_username: ${{ env.ACR_USERNAME }}
          TF_VAR_container_registry_password: ${{ env.ACR_PASSWORD }}
          TF_VAR_jive_api_key: ${{ env.JIVE_API_KEY }}
          TF_VAR_jira_api_token: ${{ env.JIRA_API_TOKEN }}
          TF_VAR_jira_cloud_id: ${{ env.JIRA_CLOUD_ID }}
          TF_VAR_jive_documentation: ${{ env.JIVE_DOCUMENTATION }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          tofu plan \
            -input=false \
            -var-file=environments/"$ENVIRONMENT".tfvars \
            -var="image_tag_api=${IMAGE_TAG_API}" \
            -var="image_tag_worker=${IMAGE_TAG_WORKER}" \
            -out=tfplan

      - name: Tofu apply
        working-directory: infra
        run: tofu apply -input=false -auto-approve tfplan