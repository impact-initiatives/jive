name: Deploy infrastructure

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment (maps to bicepparam file)'
        required: true
        type: string
      image_tag:
        description: 'New image tag for the components being deployed'
        required: true
        type: string
      deploy_api:
        description: 'Deploy new tag to the API container app'
        required: true
        type: boolean
      deploy_worker:
        description: 'Deploy new tag to the validation worker job'
        required: true
        type: boolean
      
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        options: [dev]
        required: true
      image_tag:
        description: 'Image tag to deploy'
        required: true
        type: string
      deploy_api:
        description: 'Deploy API app'
        type: boolean
        default: true
      deploy_worker:
        description: 'Deploy worker job'
        type: boolean
        default: true

permissions:
  contents: read

env:
  RESOURCE_GROUP: HQ-dev
  APP_NAME: jive-api
  JOB_NAME: jive-worker-validator

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG_API: ${{ inputs.deploy_api && inputs.image_tag || '' }}
      IMAGE_TAG_WORKER: ${{ inputs.deploy_worker && inputs.image_tag || '' }}
      REGISTRY_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      JIVE_API_KEY: ${{ secrets.JIVE_API_KEY }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_CLOUD_ID: ${{ secrets.JIRA_CLOUD_ID }}
      JIVE_DOCUMENTATION: ${{ secrets.JIVE_DOCUMENTATION }}
      ALLOWED_DOMAINS: ${{ secrets.ALLOWED_DOMAINS }}
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      LOG_ANALYTICS_SHARED_KEY: ${{ secrets.LOG_ANALYTICS_SHARED_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # For components NOT being deployed, look up the currently running
      # image tag so the Bicep deploy leaves them untouched.
      - name: Resolve current image tags
        run: |
          set -euo pipefail

          resolve_tag() {
            local kind="$1" name="$2"
            # -e suppresses the CLI error so we can inspect it; capture stderr separately
            if tag=$(az "$kind" show -n "$name" -g "$RESOURCE_GROUP" \
                  --query "properties.template.containers[0].image" -o tsv 2>&1 | awk -F: '{print $NF}') && \
              [ -n "$tag" ] && [[ "$tag" != *"NotFound"* ]]; then
              echo "Resolved existing tag for $name: $tag"
              echo "$tag"
            elif az "$kind" show -n "$name" -g "$RESOURCE_GROUP" -o none 2>/dev/null; then
              # resource exists but tag came back empty — something is genuinely wrong
              echo "::error::$name exists but its image tag could not be resolved"
              exit 1
            else
              echo "::notice::$name not found — first deployment, will use new tag '$NEW_TAG'"
              echo "$NEW_TAG"
            fi
          }

          export NEW_TAG="${{ inputs.image_tag }}"

          if [ -z "$IMAGE_TAG_API" ]; then
            IMAGE_TAG_API=$(resolve_tag containerapp "$APP_NAME")
            echo "IMAGE_TAG_API=$IMAGE_TAG_API" >> "$GITHUB_ENV"
          fi

          if [ -z "$IMAGE_TAG_WORKER" ]; then
            IMAGE_TAG_WORKER=$(resolve_tag containerappjob "$JOB_NAME")
            echo "IMAGE_TAG_WORKER=$IMAGE_TAG_WORKER" >> "$GITHUB_ENV"
          fi

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: latest

      - name: Tofu init
        working-directory: infra
        run: |
          tofu init -input=false \
            -backend-config="resource_group_name=$RESOURCE_GROUP" \
            -backend-config="storage_account_name=hqtfstatedev" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=jive/${{ inputs.environment }}.tfstate" \
            -backend-config="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Tofu validate
        working-directory: infra
        run: tofu validate 

      - name: Tofu plan
        working-directory: infra
        env:
          TF_VAR_registry_password: ${{ env.REGISTRY_PASSWORD }}
          TF_VAR_jive_api_key: ${{ env.JIVE_API_KEY }}
          TF_VAR_jira_api_token: ${{ env.JIRA_API_TOKEN }}
          TF_VAR_jira_cloud_id: ${{ env.JIRA_CLOUD_ID }}
          TF_VAR_jive_documentation: ${{ env.JIVE_DOCUMENTATION }}
        run: |
          tofu plan \
            -input=false \
            -var-file=environments/${{ inputs.environment }}.tfvars \
            -var="image_tag_api=${IMAGE_TAG_API}" \
            -var="image_tag_worker=${IMAGE_TAG_WORKER}" \
            -out=tfplan

      - name: Tofu apply
        working-directory: infra
        run: tofu apply -input=false -auto-approve tfplan