name: Jive build and deploy

# Jive and argus are deployed together so can share the same release tag.
# argus schemas can be released independently so can possibly have
# its own different release tag (likely only if it released twice
# in one day)

on:
  workflow_dispatch:
    types: [manual-trigger]
    inputs:
      release_tag:
        description: '"Jive" release tag in format "YYYYMMDDXX" .'
        required: true
        type: string
      release_jive:
        description: 'Publish a "Jive" release.'
        required: true
        type: boolean
      release_argus_schemas:
        description: 'Publish an "Arugs Schemas" release.'
        required: true
        type: boolean
      argus_schemas_release_tag:
        description: '"Argus Schemas" release tag in format "YYYYMMDDXX".'
        required: true
        type: string
      deploy_jive_worker:
        description: 'Create Jive worker image and container app revision.'
        required: true
        type: boolean      
      deploy_jive_api:
        description: 'Create Jive api image and container app revision.'
        required: true
        type: boolean  
      release_type:
        description: 'Type of release.'
        required: true
        # type: environment need admin to create these
        type: choice
        options:
          - dev
          - test
          - prod

permissions:
  contents: write

jobs:  

  create_jive_release:
    if: ${{ inputs.release_jive &&  always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7  

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          generate_release_notes: true

  build_and_push_jive_worker_images:
    needs: create_jive_release
    if: ${{ always() && inputs.deploy_jive_worker && (needs.create_jive_release.result == 'success' || needs.create_jive_release.result == 'skipped')}}
    uses: ./.github/workflows/push_to_azure_acr.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      acr_name: acrimpact
      image_name: jive-worker-validator
      # release_type: ${{ inputs.release_type }}
      file: ./workers/validator/Dockerfile
    secrets:
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}

  create_container_app_revision_worker:
    needs: build_and_push_jive_worker_images
    if: ${{ always() &&  inputs.deploy_jive_worker && needs.build_and_push_jive_worker_images.result == 'success' }}
    uses: ./.github/workflows/push_to_azure_containerapp.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      acr_name: acrimpact
      image_name: jive-worker-validator
      # release_type: ${{ inputs.release_type }}
      container_app_name: jive-worker-validator
      container_app_type: job
    secrets:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      ACR_RESOURCE_GROUP: ${{ secrets.ACR_RESOURCE_GROUP }}

  build_and_push_jive_api_images:
    needs: create_jive_release
    if: ${{ always() && inputs.deploy_jive_api && (needs.create_jive_release.result == 'success' || needs.create_jive_release.result == 'skipped')}}
    uses: ./.github/workflows/push_to_azure_acr.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      acr_name: acrimpact
      image_name: jive-api
      # release_type: ${{ inputs.release_type }}
      file: ./api/Dockerfile
    secrets:
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}

  create_container_app_revision_api:
    needs: build_and_push_jive_api_images
    if: ${{ inputs.deploy_jive_api && always() && needs.build_and_push_jive_api_images.result == 'success' }}
    uses: ./.github/workflows/push_to_azure_containerapp.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      acr_name: acrimpact
      image_name: jive-api
      # release_type: ${{ inputs.release_type }}
      container_app_name: jive-ingress
      container_app_type: app
    secrets:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
      ACR_RESOURCE_GROUP: ${{ secrets.ACR_RESOURCE_GROUP }}
    
  # leave this at the end so that the release is not made if other components fail
  create_argus_schemas_release:
    needs: create_container_app_revision_worker
    if: ${{ always() &&  inputs.release_argus_schemas && ( needs.create_container_app_revision_worker.result == 'success' || needs.create_container_app_revision_worker.result == 'skipped')}}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger argus_schemas workflow
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.REPO_DISPATCH_TOKEN }}  
          repository: impact-initiatives/argus_schemas
          event-type: manual-release
          client-payload: '{"release_tag": "${{ inputs.argus_schemas_release_tag }}"}'