name: Jive build and deploy images

# Builds Jive images and deploys them to the dev envrionment.

on:
  workflow_dispatch:
    inputs:
      release_jive:
        description: 'Publish a "Jive" release.'
        required: true
        type: boolean
      jive_release_tag:
        description: '"Jive" release tag in format "YYYYMMDDXX" .'
        required: true
        type: string
      jive_prerelease:                     
        description: 'Mark the "Jive" release as a pre-release.'
        required: false
        type: boolean
        default: false
      release_argus_schemas:
        description: 'Publish an "Arugs Schemas" release.'
        required: true
        type: boolean
      argus_schemas_release_tag:
        description: '"Argus Schemas" release tag in format "YYYYMMDDXX".'
        required: true
        type: string
        default: latest
      argus_schemas_prerelease:             
        description: 'Mark the "Argus Schemas" release as a pre-release.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:  

  create_jive_release:
    if: ${{ inputs.release_jive &&  always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout codes
        uses: actions/checkout@v7.0.1  
        with:
          persist-credentials: false

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.jive_release_tag }}
          PRE_RELEASE: ${{ inputs.jive_prerelease }}
        run: |
          ARGS=""
          if [[ "$PRE_RELEASE" == "true" ]]; then
            ARGS="--prerelease"
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            $ARGS

  create_argus_schemas_release:
    if: ${{ always() &&  inputs.release_argus_schemas}}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger argus_schemas workflow
        uses: peter-evans/repository-dispatch@v4.0.1
        with:
          token: ${{ secrets.REPO_DISPATCH_TOKEN }}  
          repository: impact-initiatives/argus_schemas
          event-type: manual-release
          client-payload: '{"release_tag": "${{ inputs.argus_schemas_release_tag }}", "prerelease": "${{ inputs.argus_schemas_prerelease }}"}'


  



    