name: Create container app revision

on:
  workflow_call:
    inputs:
      release_tag:
        description: 'Release tag in format "YYYYMMDDXX".'
        required: true
        type: string
      image_name:
        description: 'Name of the Docker image.'
        required: true
        type: string
      acr_name:
        description: 'Azure container registry name.'
        required: true
        type: string
      # release_type:
      #   description: 'Type of release.'
      #   required: true
      #   type: string
        # type: environment/choices not supported for workflow_call
      container_app_name:
        description: 'Name of the Azure container app the image is for.'
        required: true
        type: string
      container_app_type:
        type: choice
        description: What type of container
        options: 
        - job
        - app
    secrets:
      AZURE_CREDENTIALS:
        required: true
      ACR_RESOURCE_GROUP:
        required: true

jobs:
  create_app_revision:
    if: ${{ inputs.container_app_type == 'app'}}
    runs-on: ubuntu-latest
    steps:      
      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy containerapp        
        run: |
            az containerapp update -n ${{ inputs.container_app_name }} \
            -g ${{ secrets.ACR_RESOURCE_GROUP }} \
            --image ${{ inputs.acr_name }}.azurecr.io/${{ inputs.image_name }}:${{ inputs.release_tag }} \
            --revision-suffix ${{ inputs.release_tag }}
  create_job_revision:
    if: ${{ inputs.container_app_type == 'job'}}
    runs-on: ubuntu-latest
    steps:      
      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy containerapp        
        run: |
            az containerapp job update -n ${{ inputs.container_app_name }} \
            -g ${{ secrets.ACR_RESOURCE_GROUP }} \
            --image ${{ inputs.acr_name }}.azurecr.io/${{ inputs.image_name }}:${{ inputs.release_tag }} \

      