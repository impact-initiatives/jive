name: Validate IaC code

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
  pull_request:
    paths:
      - 'infra/**'
permissions:
  contents: read

jobs: 
  check-code:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra
    
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: latest

      - name: Tofu format
        run: tofu fmt -recursive -check

      - name: Tofu init
        run: tofu init -backend=false -input=false      

      - name: Tofu validate
        run: tofu validate 

  plan:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write 
    defaults:
      run:
        working-directory: ./infra
    # Only run the credential-holding plan for same-repo PRs / main pushes.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Azure login
        uses: azure/login@v3.1.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Resolve current image tags
        env:
          RESOURCE_GROUP: ${{ secrets.ACR_RESOURCE_GROUP }}
          APP_NAME: jive-api-dev
          JOB_NAME: jive-worker-validator-dev
        run: |
          set -euo pipefail
          TAG_API=$(az containerapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" \
            --query "properties.template.containers[0].image" -o tsv | awk -F: '{print $NF}')
          TAG_WORKER=$(az containerapp job show -n "$JOB_NAME" -g "$RESOURCE_GROUP" \
            --query "properties.template.containers[0].image" -o tsv | awk -F: '{print $NF}')
          echo "IMAGE_TAG_API=$TAG_API"     >> "$GITHUB_ENV"
          echo "IMAGE_TAG_WORKER=$TAG_WORKER" >> "$GITHUB_ENV"

      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: latest

      - name: Tofu init
        env:
          RESOURCE_GROUP: ${{ secrets.ACR_RESOURCE_GROUP }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          tofu init -input=false \
            -backend-config="resource_group_name=$RESOURCE_GROUP" \
            -backend-config="storage_account_name=hqtfstatedev" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=jive/dev.tfstate" \
            -backend-config="subscription_id=$SUBSCRIPTION_ID"

      - name: Tofu plan
        id: plan                          
        continue-on-error: true 
        env:
          TF_VAR_resource_group_name: ${{ secrets.ACR_RESOURCE_GROUP }}
          TF_VAR_container_registry_username: ${{ secrets.ACR_USERNAME }}
          TF_VAR_container_registry_password: ${{ secrets.ACR_PASSWORD }}
          TF_VAR_jive_api_key: ${{ secrets.JIVE_API_KEY }}
          TF_VAR_jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
          TF_VAR_jira_cloud_id: ${{ secrets.JIRA_CLOUD_ID }}
          TF_VAR_jive_documentation: ${{ secrets.JIVE_DOCUMENTATION }}
        run: |
          tofu plan -input=false -no-color \
            -var-file=environments/dev.tfvars \
            -var="image_tag_api=${IMAGE_TAG_API}" \
            -var="image_tag_worker=${IMAGE_TAG_WORKER}" \
            -out=tfplan

      - name: Render plan to job summary
        if: steps.plan.outcome == 'success'
        run: |
          tofu show tfplan -no-color >> "$GITHUB_STEP_SUMMARY"

      - name: Post plan to PR
        if: github.event_name == 'pull_request' && !cancelled()
        uses: actions/github-script@v8.0.0
        env:
            PLAN: ${{ steps.plan.outputs.stdout }}
            PLAN_OUTCOME: ${{ steps.plan.outcome }}
        
        with:
          
          script: |
            const MARKER = '<!-- plan-comment-dev -->';

            const status = process.env.PLAN_OUTCOME === 'success'
              ? '✅ Plan succeeded'
              : '❌ Plan failed';

            const body = [
              MARKER,
              '#### Tofu plan (dev)',
              status,
              '',
              '<details><summary>Show plan output</summary>',
              '',
              '```hcl',
              process.env.PLAN,
              '```',
              '</details>'
            ].join('\n');

            // Find an existing comment containing the marker
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(MARKER));

            if (existing) {
              // Update in place instead of posting a duplicate
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail job if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

