name: Check IaC code

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
  pull_request:
    paths:
      - 'infra/**'
permissions:
  contents: read

jobs:
  check-code:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra
    
    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: latest

      - name: Tofu format
        run: tofu fmt -recursive -check

      - name: Tofu init
        run: tofu init -backend=false -input=false      

      - name: Tofu validate
        run: tofu validate 

