name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    name: Detect changed projects
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      projects: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          # Each key = a project to test; the value = paths that should
          # trigger it.
          filters: |
            api:
              - 'api/**'
            common/argus:
              - 'common/argus/**'
            workers/validator:
              - 'workers/validator/**'
              - 'common/argus/**'

  test:
    name: Tests (${{ matrix.project }})
    needs: changes
    if: ${{ needs.changes.outputs.projects != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.changes.outputs.projects) }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7dcc9c355c18e # v10.3.2
      - name: Install the project
        run: uv sync --locked --all-extras --dev
      - name: Run tests
        run: uv run pytest src/tests